# Test fixture only. Password is test-only-password. Never deploy this file.
server:
  bind_address: "127.0.0.1"
  port: 18085
  public_base_url: "http://127.0.0.1:18085"
  trusted_proxy_cidrs: ["127.0.0.1/32"]
  read_timeout: 15s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 60s
hydra:
  admin_base_url: "http://127.0.0.1:14445"
  public_api_base_url: ""
  timeout: 1s
  token_revoke_enabled: false
auth:
  username: "admin"
  password_hash: "$2a$12$weA3RbmfVhAOrVdfcBgYYOt3wmKztLaM.691ZQ.p/jdMyXNq2pzMm"
  session_ttl: 8h
  session_cookie_name: "hydra_admin_session"
  max_sessions: 20
  login:
    window: 15m
    max_attempts_per_ip: 10
    max_attempts_per_username: 5
    lockout_duration: 15m
security:
  csrf_header_name: "X-CSRF-Token"
  cookie_secure: false
  cookie_same_site: "lax"
  api_rate_limit:
    read_per_minute_per_ip: 120
    write_per_minute_per_ip: 30
  request_body_max_bytes: 1048576
audit:
  path: "./logs/audit.jsonl"
  max_file_bytes: 10485760
  max_archives: 14
  file_mode: "0600"
log:
  level: "info"
  format: "json"
  path: "./logs/hydra-admin.log"
  max_file_bytes: 10485760
  max_archives: 14
  file_mode: "0600"

# Test fixture only. Password is test-only-password. Never deploy this file.
server:
  bind_address: "127.0.0.1"
  port: 8085
  # 管理台的浏览器访问根地址；不是 Hydra issuer。
  public_base_url: "http://127.0.0.1:8085"
  trusted_proxy_cidrs:
    - "127.0.0.1/32"
  read_timeout: 15s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 60s

hydra:
  # 常见单机示例；Admin API 必须通过受限网络供本应用访问，不支持额外网关认证。
  admin_base_url: "http://127.0.0.1:4445"
  # 仅在启用 Token revoke 时填写；它可能与 issuer 相同，不能猜测。
  public_api_base_url: ""
  timeout: 1s
  token_revoke_enabled: false

auth:
  username: "admin"
  # 支持 bcrypt 或 Argon2id PHC 编码。以下是假值，不可用于登录。
  password_hash: "$2a$12$weA3RbmfVhAOrVdfcBgYYOt3wmKztLaM.691ZQ.p/jdMyXNq2pzMm"
  session_ttl: 8h
  session_cookie_name: "hydra_admin_session"
  max_sessions: 20
  login:
    window: 15m
    max_attempts_per_ip: 10
    max_attempts_per_username: 5
    lockout_duration: 15m

security:
  csrf_header_name: "X-CSRF-Token"
  # 生产环境必须为 true；仅当管理台 URL 与监听地址均为回环 HTTP 时允许 false。
  cookie_secure: false
  cookie_same_site: "lax"
  api_rate_limit:
    read_per_minute_per_ip: 120
    write_per_minute_per_ip: 30
  request_body_max_bytes: 1048576

audit:
  path: "./logs/audit.jsonl"
  max_file_bytes: 10485760
  max_archives: 14
  file_mode: "0600"

log:
  level: "info"
  format: "json"
  path: "./logs/hydra-admin.log"
  max_file_bytes: 10485760
  max_archives: 14
  file_mode: "0600"
